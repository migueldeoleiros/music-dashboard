name: music-dashboard
x-server: &server
  image: ${COMPOSE_PROJECT_NAME:-music-dashboard}-server:local
  build:
    context: .
    dockerfile: deploy/Dockerfile.server
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  mem_limit: 512m
  cpus: 1.0
  security_opt: ["no-new-privileges:true"]
services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MUSIC_ADMIN_PASSWORD:?Set MUSIC_ADMIN_PASSWORD in private .env}
      POSTGRES_DB: music_dashboard
      MUSIC_WRITER_PASSWORD: ${MUSIC_WRITER_PASSWORD:?Set MUSIC_WRITER_PASSWORD in private .env}
      MUSIC_API_PASSWORD: ${MUSIC_API_PASSWORD:?Set MUSIC_API_PASSWORD in private .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d music_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
  api:
    <<: *server
    environment:
      MUSIC_DATABASE_URL: postgresql+psycopg://music_api:${MUSIC_API_PASSWORD}@db/music_dashboard
      MUSIC_FIXTURE_MODE: ${MUSIC_FIXTURE_MODE:-true}
      MUSIC_PUBLIC_EVENT_FEEDS_ENABLED: ${MUSIC_PUBLIC_EVENT_FEEDS_ENABLED:-false}
      MUSIC_ARTWORK_DIR: /var/artwork
    volumes:
      - artwork-data:/var/artwork:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *server
    command: ["python", "-m", "music_dashboard.worker"]
    environment:
      MUSIC_DATABASE_URL: postgresql+psycopg://music_writer:${MUSIC_WRITER_PASSWORD}@db/music_dashboard
      # SQL-backed synthetic API does not authorize upstream worker access.
      MUSIC_FIXTURE_MODE: ${MUSIC_WORKER_FIXTURE_MODE:-true}
      MUSIC_METADATA_USER_AGENT: ${MUSIC_METADATA_USER_AGENT:-}
      MUSIC_SYNC_OVERLAP_HOURS: ${MUSIC_SYNC_OVERLAP_HOURS:-72}
      MUSIC_REFRESH_AUTO_INTERVAL_SECONDS: ${MUSIC_REFRESH_AUTO_INTERVAL_SECONDS:-3600}
      MUSIC_RECONCILE_INTERVAL_SECONDS: ${MUSIC_RECONCILE_INTERVAL_SECONDS:-604800}
      MUSIC_EXPORT_MAX_BYTES: ${MUSIC_EXPORT_MAX_BYTES:-67108864}
      MUSIC_METADATA_EMPTY_TTL_DAYS: ${MUSIC_METADATA_EMPTY_TTL_DAYS:-7}
      MUSIC_METADATA_POSITIVE_TTL_DAYS: ${MUSIC_METADATA_POSITIVE_TTL_DAYS:-30}
      MUSIC_METADATA_RETRY_BASE_SECONDS: ${MUSIC_METADATA_RETRY_BASE_SECONDS:-30}
      MUSIC_METADATA_RETRY_MAX_SECONDS: ${MUSIC_METADATA_RETRY_MAX_SECONDS:-86400}
      MUSIC_ENRICHMENT_BATCH_SIZE: ${MUSIC_ENRICHMENT_BATCH_SIZE:-100}
      MUSIC_ARTWORK_DIR: /var/artwork
      LISTENBRAINZ_USERNAME: ${LISTENBRAINZ_USERNAME:-}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
    volumes:
      - artwork-data:/var/artwork
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    environment:
      MUSIC_PAGE_TITLE: ${MUSIC_PAGE_TITLE:-Music Dashboard}
    # api is created first and seeds the volume with /var/artwork's app ownership (see Dockerfile.server).
    volumes:
      - artwork-data:/usr/share/nginx/artwork:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
  artwork-data:
