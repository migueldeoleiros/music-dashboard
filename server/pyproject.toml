[project]
name = "music-dashboard"
version = "0.1.0"
description = "Read-only ListenBrainz dashboard foundations"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "alembic==1.17.2",
  "pydantic-settings==2.12.0",
  "tzdata==2025.2",
]

[dependency-groups]
dev = ["pytest==9.0.1", "httpx==0.28.1", "ruff==0.14.6", "mypy==1.18.2"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project.scripts]
music-dashboard = "music_dashboard.presentation.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL databases"]
