# Static client + same-origin /api proxy. Included as the default server config
# of nginxinc/nginx-unprivileged (listens on 8080).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        # No URI part: original /api/... path is preserved upstream.
        proxy_pass http://api:8000;
        # Preserve the port for strict same-origin refresh admission.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # nginx drops server-level add_header directives in any location that defines its own,
    # so nosniff/Referrer-Policy are repeated below. /api/ defines none and inherits them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # CSP applies to the HTML document (and so to everything it loads). Artwork is hotlinked
    # from the hosts below only (docs/architecture.md, "Artwork and Deezer terms"); the app
    # needs no fonts/workers/blobs beyond 'self' (Inter is a bundled woff2, charts are canvas).
    # 'unsafe-inline' for styles only: React/ECharts set inline style attributes.
    location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn-images.dzcdn.net https://e-cdns-images.dzcdn.net https://coverartarchive.org https://archive.org https://*.archive.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
